[tool.poetry]
name = "madro"
version = "0.1.0"
description = "MADRO :: Multi-Agent Data Retrieval Orchestrator"
authors = ["João Pedro Pinheiro <jpinheiro@inf.puc-rio.br>"]
packages = [{ include = "madro", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
django = "^6.0"
pydantic-ai = { version = "^1.80", extras = ["openai", "google"] }
psycopg = { version = "^3.2", extras = ["binary"] }
pgvector = "^0.4"
pyyaml = "^6.0"
transformers = "^5.5.4"
qwen-vl-utils = "^0.0.14"
torch = "^2.7.0"
torchvision = "^0.22.0"
sentence-transformers = "^5.4.1"
accelerate = "^1.7.0"
python-dotenv = "^1.2.2"
pillow = "^12.2.0"
tabulate = "^0.9.0"
openpyxl = "^3.1.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-django = "^4.10"
ruff = "^0.11"
allure-pytest = "^2.16.0"

[tool.ruff]
src = ["src"]
line-length = 100

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "madro.settings"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not benchmark and not baseline'"
markers = [
    "benchmark: live end-to-end MADRO benchmark (hits real DBs and LLMs, run via `make benchmark`)",
    "baseline: naive one-shot SQL baseline against dowser, run via `make benchmark-baseline`",
]

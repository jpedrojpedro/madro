model:
#  name: gemini-3.5-flash
  name: gemini-3.1-flash-lite
  temperature: 0
  max_tokens: 65535

image_model:
  name: Qwen/Qwen2.5-VL-3B-Instruct
  temperature: 0
  max_tokens: 4096

fusion:
  text:
    alpha: 0.3   # lexical weight
    beta: 0.7    # semantic weight
  image:
    gamma: 0.5   # lexical weight
    delta: 0.5   # semantic weight
  modality_weights:
    w_t: 0.7       # text modality
    w_i: 0.3       # image modality

debug:
  enabled: false
  log_level: INFO

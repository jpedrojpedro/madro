model:
#  name: gemini-3.5-flash
  name: gemini-3.1-flash-lite
  temperature: 0
  max_tokens: 65535

# Served locally via Ollama — see get_image_model() in config.py.
image_model:
  name: qwen2.5vl:7b
  temperature: 0
  max_tokens: 4096

# Served locally via Ollama (http://localhost:11434) — see get_qwen_coder_model()
# in config.py. Used only as a second naive-SQL baseline, alongside Gemini.
qwen_baseline_model:
  name: qwen2.5-coder:7b
  temperature: 0
  max_tokens: 4096

# Also served locally via Ollama — see get_llama_model() in config.py. A third
# naive-SQL baseline: same size class as qwen_baseline_model, but a
# generalist model rather than code-specialized.
llama_baseline_model:
  name: llama3.1:8b
  temperature: 0
  max_tokens: 4096

# Served locally via Ollama — see get_retrieval_sql_model() in config.py.
# Only used when retrieval_sql_backend (below) is "arctic".
retrieval_sql_model:
  name: a-kore/Arctic-Text2SQL-R1-7B
  temperature: 0
  max_tokens: 4096

# Which resolver class every RetrievalAgent uses for its on-the-fly SQL
# generation — see retrieval_agents/sql_resolvers.py. "gemini" (annotated
# Markdown schema, configs/dowser_schema.md) or "arctic" (pure DDL,
# configs/dowser_schema.sql — matches Arctic's own training format).
retrieval_sql_backend: gemini

fusion:
  alpha: 0.3   # lexical weight
  beta: 0.7    # semantic weight

debug:
  enabled: false
  log_level: INFO
